name: toolbox-observability

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-admin-change-me}
      TOOLBOX_DB_USER: ${TOOLBOX_DB_USER:-toolbox_reader}
      TOOLBOX_DB_PASSWORD: ${TOOLBOX_DB_PASSWORD:-local-reader-change-me}
    command:
      - postgres
      - -c
      - track_io_timing=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [observability]
    labels:
      observability.logs: "true"
      observability.service_name: postgres
      observability.db_system: postgresql
      observability.db_cluster: local
      observability.db_instance: postgres-1
      observability.db_role: primary
      observability.environment: local

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-local-redis-change-me}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-local-redis-change-me}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [observability]
    labels:
      observability.logs: "true"
      observability.service_name: redis
      observability.db_system: redis
      observability.db_cluster: local
      observability.db_instance: redis-1
      observability.db_role: primary
      observability.environment: local

  mongodb:
    image: mongo:${MONGO_VERSION:-8.0}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local-mongo-root-change-me}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-app}
      MONGO_TOOLBOX_USER: ${MONGO_TOOLBOX_USER:-toolbox_monitor}
      MONGO_TOOLBOX_PASSWORD: ${MONGO_TOOLBOX_PASSWORD:-local-mongo-monitor-change-me}
    volumes:
      - mongodb-data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"
      interval: 5s
      timeout: 5s
      retries: 18
    networks: [observability]
    labels:
      observability.logs: "true"
      observability.service_name: mongodb
      observability.db_system: mongodb
      observability.db_cluster: local
      observability.db_instance: mongodb-1
      observability.db_role: primary
      observability.environment: local

  postgres-app-init:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-admin-change-me}
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_NAME:-app}
      POSTGRES_USER: postgres
      APP_DB_USER: ${APP_DB_USER:-demo_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-demo-app-change-me}
      TOOLBOX_DB_USER: ${TOOLBOX_DB_USER:-toolbox_reader}
      ORDERS_READER_USER: ${ORDERS_READER_USER:-orders_reader}
      ORDERS_READER_PASSWORD: ${ORDERS_READER_PASSWORD:-local-orders-reader-change-me}
    command: ["sh", "/bootstrap/postgres.sh"]
    volumes:
      - ./demo-server/bootstrap/postgres.sh:/bootstrap/postgres.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [observability]

  mongodb-app-init:
    image: mongo:${MONGO_VERSION:-8.0}
    restart: "no"
    environment:
      MONGO_DATABASE: ${MONGO_DATABASE:-app}
      MONGO_APP_USER: ${MONGO_APP_USER:-demo_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-local-demo-mongo-change-me}
    entrypoint: ["mongosh"]
    command:
      - --host
      - mongodb
      - --username
      - ${MONGO_ROOT_USERNAME:-root}
      - --password
      - ${MONGO_ROOT_PASSWORD:-local-mongo-root-change-me}
      - --authenticationDatabase
      - admin
      - --file
      - /bootstrap/mongodb.js
    volumes:
      - ./demo-server/bootstrap/mongodb.js:/bootstrap/mongodb.js:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [observability]

  demo-api:
    build:
      context: ./demo-server
    restart: unless-stopped
    environment:
      PORT: 3001
      OTEL_SERVICE_NAME: ${DEMO_SERVICE_NAME:-demo-api}
      OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-toolbox-observability}
      OTEL_SERVICE_VERSION: ${DEMO_SERVICE_VERSION:-0.1.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-app}
      APP_DB_USER: ${APP_DB_USER:-demo_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-demo-app-change-me}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-change-me}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-app}
      MONGO_APP_USER: ${MONGO_APP_USER:-demo_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-local-demo-mongo-change-me}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres-app-init:
        condition: service_completed_successfully
      mongodb-app-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks: [observability]
    labels:
      observability.logs: "true"
      observability.service_name: ${DEMO_SERVICE_NAME:-demo-api}

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:${TOOLBOX_VERSION:-1.11.0}
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-app}
      TOOLBOX_DB_USER: ${TOOLBOX_DB_USER:-toolbox_reader}
      TOOLBOX_DB_PASSWORD: ${TOOLBOX_DB_PASSWORD:-local-reader-change-me}
      ORDERS_READER_USER: ${ORDERS_READER_USER:-orders_reader}
      ORDERS_READER_PASSWORD: ${ORDERS_READER_PASSWORD:-local-orders-reader-change-me}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-change-me}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-app}
      MONGO_TOOLBOX_USER: ${MONGO_TOOLBOX_USER:-toolbox_monitor}
      MONGO_TOOLBOX_PASSWORD: ${MONGO_TOOLBOX_PASSWORD:-local-mongo-monitor-change-me}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: toolbox-db-observer
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    command:
      - --config=/config/tools.yaml
      - --address=0.0.0.0
      - --port=5000
      - --telemetry-otlp=otel-collector:4318
      - --telemetry-service-name=toolbox-db-observer
      - --logging-format=json
      - --log-level=info
      - --allowed-hosts=${TOOLBOX_ALLOWED_HOSTS:-localhost:5000,127.0.0.1:5000,toolbox:5000,172.30.1.63:5000}
      - --allowed-origins=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./toolbox/tools.yaml:/config/tools.yaml:ro
    ports:
      - "${TOOLBOX_BIND_ADDRESS:-0.0.0.0}:5000:5000"
    depends_on:
      postgres-app-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks: [observability]
    labels:
      observability.logs: "true"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION:-v0.18.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/postgres_exporter.yml
      # The read-only monitoring role cannot call pg_ls_waldir(); WAL metrics
      # are outside this dashboard's scope, so keep that collector disabled.
      - --no-collector.wal
    volumes:
      - ./prometheus/postgres-exporter.yml:/etc/postgres_exporter.yml:ro
    environment:
      DATA_SOURCE_URI: ${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-app}?sslmode=${DB_SSLMODE:-disable}
      DATA_SOURCE_USER: ${TOOLBOX_DB_USER:-toolbox_reader}
      DATA_SOURCE_PASS: ${TOOLBOX_DB_PASSWORD:-local-reader-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [observability]

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.77.0}
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-change-me}
    depends_on:
      redis:
        condition: service_healthy
    networks: [observability]

  mongodb-exporter:
    image: percona/mongodb_exporter:${MONGODB_EXPORTER_VERSION:-0.47.2}
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_TOOLBOX_USER:-toolbox_monitor}:${MONGO_TOOLBOX_PASSWORD:-local-mongo-monitor-change-me}@mongodb:27017/admin?authSource=admin
    command: ["--collect-all", "--compatible-mode"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [observability]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.135.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
      - loki
    networks: [observability]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
      - postgres-exporter
      - redis-exporter
      - mongodb-exporter
    networks: [observability]

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.5}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [observability]

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.11.3}
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks: [observability]

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.11.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    networks: [observability]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.2.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks: [observability]

networks:
  observability:

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
