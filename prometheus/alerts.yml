groups:
  - name: database-health
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL {{ $labels.db_instance }} exporter cannot reach the database

      - alert: PostgreSQLConnectionsHigh
        expr: sum by (db_instance) (pg_stat_database_numbackends{datname!~"template.*"}) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL {{ $labels.db_instance }} connections exceed the local stack threshold

      - alert: PostgreSQLDeadlockDetected
        expr: sum by (db_instance) (increase(pg_stat_database_deadlocks{datname!~"template.*"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL {{ $labels.db_instance }} had a deadlock in the last five minutes

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Redis {{ $labels.db_instance }} exporter cannot reach the database

      - alert: RedisMemoryHigh
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis {{ $labels.db_instance }} memory usage is above 80 percent of maxmemory

      - alert: MongoDBDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: MongoDB {{ $labels.db_instance }} exporter cannot reach the database

  - name: toolbox-health
    rules:
      - alert: ToolboxToolLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(mcp_server_operation_duration_seconds_bucket{mcp_method_name="tools/call"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MCP Toolbox tool execution p95 is above two seconds

      - alert: ToolboxToolErrors
        expr: sum(rate(mcp_server_operation_duration_seconds_count{mcp_method_name="tools/call", error_type!=""}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: MCP Toolbox is reporting tool execution errors
