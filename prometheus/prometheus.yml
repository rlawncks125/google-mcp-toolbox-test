global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: toolbox-otel
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metric_relabel_configs:
      # Query ID allowlist. The first ID belongs to examples/postgres/selected-query.sql.
      # Replace it or add IDs separated by |, for example:
      # regex: 'pg_stat_statements_.+;(-123456789|987654321)'
      - source_labels: [__name__, queryid]
        separator: ";"
        regex: 'pg_stat_statements_.+;(7814683544229287637)'
        target_label: query_scope
        replacement: selected
        action: replace
      # Drop every non-allowlisted pg_stat_statements series while retaining
      # ordinary PostgreSQL metrics in this single scrape job.
      - source_labels: [__name__, query_scope]
        separator: ";"
        regex: 'pg_stat_statements_.+;'
        action: drop

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
